[package]
name = "app"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "ezsc-probe"

[features]
default = []
gui = ["dep:gpui", "dep:gpui_platform"]

[dependencies]
bluetooth.workspace = true
ezsc_core.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "signal",
    "time",
] }
gpui = { workspace = true, optional = true }
gpui_platform = { workspace = true, optional = true }

[[bin]]
name = "ezsc-probe"
path = "src/main.rs"

[[bin]]
name = "easy-sound-connect"
path = "src/gui.rs"
required-features = ["gui"]
